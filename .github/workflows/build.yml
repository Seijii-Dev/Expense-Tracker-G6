name: Build Expo app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - all
          - ios
      build_mode:
        description: "Build runner: local (free GitHub Actions runner, no EAS quota) or cloud (EAS Cloud)"
        required: true
        default: local
        type: choice
        options:
          - local
          - cloud
      architecture:
        description: "Android target ABI (arm64-v8a: fast ~10m build for physical phones; all: universal)"
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - all

jobs:
  build:
    name: ${{ inputs.build_mode == 'local' && 'Local' || 'EAS Cloud' }} ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"
      _JAVA_OPTIONS: "-Xmx4096m"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build parameters
        run: |
          if [ "${{ inputs.build_mode }}" = "local" ] && [ "${{ inputs.platform }}" != "android" ]; then
            echo "::error::Local runner builds on ubuntu-latest only support the 'android' platform. For iOS builds, select 'cloud' mode."
            exit 1
          fi

      - name: Free runner disk space for Android build
        if: ${{ inputs.build_mode == 'local' }}
        run: |
          echo "::group::Disk space before cleanup"
          df -h
          echo "::endgroup::"

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true

          echo "::group::Disk space after cleanup"
          df -h
          echo "::endgroup::"

      - name: Expand swap space for Android build
        if: ${{ inputs.build_mode == 'local' }}
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: Setup Java
        if: ${{ inputs.build_mode == 'local' }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        if: ${{ inputs.build_mode == 'local' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept Android SDK licenses
        if: ${{ inputs.build_mode == 'local' }}
        run: |
          yes | sdkmanager --licenses 2>/dev/null || yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo configuration
        run: pnpm typecheck && npx expo config --type public

      - name: Configure Gradle properties & architecture
        if: ${{ inputs.build_mode == 'local' }}
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.caching=true
          EOF

          if [ "${{ inputs.architecture }}" = "arm64-v8a" ] && [ "${{ inputs.profile }}" != "production" ]; then
            echo "reactNativeArchitectures=arm64-v8a" >> ~/.gradle/gradle.properties
            echo "GRADLE_OPTS=${GRADLE_OPTS} -Dorg.gradle.project.reactNativeArchitectures=arm64-v8a" >> "$GITHUB_ENV"
            echo "Targeting arm64-v8a for fast preview build"
          else
            echo "Building all architectures"
          fi
          echo "::group::Configured ~/.gradle/gradle.properties"
          cat ~/.gradle/gradle.properties
          echo "::endgroup::"

      - name: Build Android app locally on GitHub runner (No EAS quota used)
        if: ${{ inputs.build_mode == 'local' }}
        run: |
          mkdir -p build-output
          EXT="apk"
          if [ "${{ inputs.profile }}" = "production" ]; then
            EXT="aab"
          fi
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --local \
            --non-interactive \
            --output="./build-output/app-${{ inputs.profile }}.${EXT}"

      - name: Output failure diagnostics and logs
        if: ${{ failure() && inputs.build_mode == 'local' }}
        run: |
          echo "::group::EAS Local Build Logs"
          find ~/.eas-build-local -type f 2>/dev/null | while read -r f; do
            echo "--- $f ---"
            tail -n 150 "$f"
          done || true
          echo "::endgroup::"

          echo "::group::Gradle Daemon Logs"
          find ~/.gradle/daemon -name "*.log" 2>/dev/null | while read -r f; do
            echo "--- $f ---"
            tail -n 100 "$f"
          done || true
          echo "::endgroup::"

          echo "::group::System Memory and Dmesg (OOM check)"
          free -h
          dmesg -T | grep -iE 'killed process|oom|out of memory' | tail -n 20 || true
          echo "::endgroup::"

      - name: Upload build failure logs
        if: ${{ failure() && inputs.build_mode == 'local' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            ~/.eas-build-local/**
            ~/.gradle/daemon/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build native app with EAS Cloud
        if: ${{ inputs.build_mode == 'cloud' }}
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive

      - name: Upload build artifact
        if: ${{ inputs.build_mode == 'local' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.profile }}-android
          path: build-output/*
          retention-days: 14
