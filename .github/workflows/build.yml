name: Build Expo app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - all
          - ios
      build_mode:
        description: "Build runner: local (free GitHub Actions runner, no EAS quota) or cloud (EAS Cloud)"
        required: true
        default: local
        type: choice
        options:
          - local
          - cloud

jobs:
  build:
    name: ${{ inputs.build_mode == 'local' && 'Local' || 'EAS Cloud' }} ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build parameters
        run: |
          if [ "${{ inputs.build_mode }}" = "local" ] && [ "${{ inputs.platform }}" != "android" ]; then
            echo "::error::Local runner builds on ubuntu-latest only support the 'android' platform. For iOS builds, select 'cloud' mode."
            exit 1
          fi

      - name: Setup Java
        if: ${{ inputs.build_mode == 'local' }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        if: ${{ inputs.build_mode == 'local' }}
        uses: android-actions/setup-android@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo configuration
        run: pnpm typecheck && npx expo config --type public

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android app locally on GitHub runner (No EAS quota used)
        if: ${{ inputs.build_mode == 'local' }}
        run: |
          mkdir -p build-output
          EXT="apk"
          if [ "${{ inputs.profile }}" = "production" ]; then
            EXT="aab"
          fi
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --local \
            --non-interactive \
            --output="./build-output/app-${{ inputs.profile }}.${EXT}"

      - name: Build native app with EAS Cloud
        if: ${{ inputs.build_mode == 'cloud' }}
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive

      - name: Upload build artifact
        if: ${{ inputs.build_mode == 'local' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.profile }}-android
          path: build-output/*
          retention-days: 14
